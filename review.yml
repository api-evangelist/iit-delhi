reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      IIT Delhi has no centralized public API portal. The strongest verified,
      machine-consumable surface is the Central Library DSpace 8 institutional
      repository, whose REST root (/server/api) and OAI-PMH Identify endpoint
      both resolve live with HTTP 200; the DSpace core/items endpoint returns
      401 (auth required), as expected for protected content. An OAuth 2
      authentication server is live but gated behind a login/CAPTCHA with no
      published OAuth/OIDC endpoint docs. The student DevClub maintains the IITD
      Connect mobile-app backend with public Postman documentation and an
      open-source server repo, but it is a student project requiring a Bearer
      token. The official iit-delhi GitHub org exists but holds only two minor
      forked utility repos. The legacy eprint.iitd.ac.in OAI host did not
      resolve from this probe (0). No endpoints were fabricated; entries reflect
      only what resolved live.
