description: >-
  Indian Institute of Technology Delhi (IIT Delhi) is a public technical and
  research university in Hauz Khas, New Delhi — an Institute of National
  Importance and an Institution of Eminence, ranked #118 in the QS World
  University Rankings 2025. IIT Delhi operates no developer portal, publishes no
  API documentation, no OpenAPI, no terms of service for machine access and no
  security.txt or llms.txt, and nothing in this profile was published by the
  institute as a developer-facing product. What it does operate, and what this
  profile records, is a small set of genuinely institution-run machine-readable
  surfaces found by probing its own domain: a Shibboleth SAML 2.0 identity
  provider at idp.iitd.ac.in whose metadata is self-published and registered in
  the Indian access-management federation INFED and interfederated through
  eduGAIN since 2020 — the institute's strongest and least-known standards
  conformance; a DSpace 8 institutional repository at ir.iitd.ac.in with a
  functional OAI-PMH 2.0 harvesting endpoint advertising thirteen metadata
  formats; an OAuth 2 apps server at oauth.iitd.ac.in that lets campus developers
  register applications but publishes no discovery document, endpoint list or
  scope vocabulary; a Moodle deployment whose web-service endpoint answers but is
  token-gated; and an undocumented JSON API behind the shared React/Express site
  platform its departments run, which answers anonymous reads on
  convocation.iitd.ac.in, ird.iitd.ac.in and csc.iitd.ac.in. Its research
  information system is a tenant on INFLIBNET's national IRINS platform, and its
  library discovery runs through the DELNET consortium — both real institutional
  facts, neither IIT Delhi's engineering. The 2019-era student DevClub API that
  earlier profiles listed as a surface is dead: its host redirects to a domain
  that no longer resolves and its TLS certificate expired in August 2025.
