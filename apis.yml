  - aid: iit-delhi:dspace-rest
    name: IIT Delhi Institutional Repository DSpace REST API
    x-operator: institution
    description: >-
      The IIT Delhi Central Library institutional repository runs on DSpace 8.0 and
      exposes the standard DSpace REST/HAL API at /server/api on the institute's own
      host. The root endpoint is public and advertises dspaceVersion "DSpace 8.0",
      an authn link and roughly seventy resource links; discovery search answers
      anonymously; core content endpoints such as core/items return HTTP 401. The
      contract itself is the DSpace product's and belongs to DSpace, so no DSpace
      OpenAPI is saved under this institution — what IIT Delhi operates is the
      deployment and the data, which is what this entry records.
    humanURL: https://ir.iitd.ac.in/
    baseURL: https://ir.iitd.ac.in/server/api
    tags: [ Repository, DSpace, Open Access, Research, Library, REST ]
    properties:
