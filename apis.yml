  - aid: iit-delhi:oauth2
    name: IIT Delhi OAuth 2 Authentication Server
    x-operator: institution
    description: >-
      IIT Delhi operates an OAuth 2 authorization server that lets developers
      register their own campus apps and authenticate users with IIT Delhi
      credentials, and it is the real gate for the institute's own web APIs — the
      departmental platform's 401 body names it directly. The portal is live but
      wholly behind a login, and no discovery document is published: both
      /.well-known/openid-configuration and /.well-known/oauth-authorization-server
      returned 404 on 2026-08-30, and no endpoint, grant type or scope vocabulary
      exists in public. Publishing RFC 8414 metadata would be the single
      highest-leverage change available to this institution.
    humanURL: https://oauth.iitd.ac.in/
    tags: [ Authentication, Identity, SSO, OAuth 2 ]
    tags_raw:
