x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    IIT Delhi is genuinely thin, and the thinness is a documentation gap rather
    than an absence of surfaces. Five institution-operated machine-readable
    surfaces were confirmed live on 2026-08-30 — a Shibboleth SAML 2.0 identity
    provider, an OAI-PMH 2.0 harvesting endpoint, a DSpace 8 REST API, a Moodle
    web-service endpoint and an undocumented departmental JSON API — and the
    institute documents none of them. The two that would most repay description
    are gated: the OAuth 2 apps server at oauth.iitd.ac.in is entirely behind an
    interactive login and returns 404 for both OpenID Connect discovery and RFC
    8414 authorization-server metadata, so its endpoints, grants and scopes are
    unreadable from outside; and the DSpace content endpoints return 401 to
    anonymous callers even though the root document and discovery search are
    public. No contract in this repo is a vendor's, and none was saved from a
    vendor host. The one tenant relationship recorded — IIT Delhi's research
    information portal on INFLIBNET's IRINS platform — sits behind a Cloudflare
    bot challenge and was confirmed by name from third-party sources rather than
    read directly.
