apis:
  - aid: iit-delhi:idp-shibboleth
    name: IIT Delhi Shibboleth Identity Provider (SAML 2.0 metadata)
    x-operator: institution
    description: >-
      IIT Delhi runs its own Shibboleth identity provider at idp.iitd.ac.in and
      self-publishes its SAML 2.0 metadata as a machine-readable EntityDescriptor.
      The document names the institute as the organisation, scopes assertions to
      iitd.ac.in, and advertises IDPSSODescriptor and AttributeAuthorityDescriptor
      roles across HTTP-Redirect, HTTP-POST, POST-SimpleSign and SOAP bindings. The
      entity is registered in INFED, the Indian access-management federation
      operated by INFLIBNET, and interfederated through eduGAIN as entity 672721
      since 2020-03-28 with a passing connectivity check. Institution-operated by
      definition, and the single most substantial machine-readable artifact IIT
      Delhi publishes about itself.
    humanURL: https://idp.iitd.ac.in/
    baseURL: https://idp.iitd.ac.in/idp
    tags: [ Identity, Federation, SAML, Shibboleth, Single Sign-On, eduGAIN, INFED ]
    properties:
      - type: IdentityFederation
        url: https://idp.iitd.ac.in/idp/shibboleth
      - type: Authentication
        url: authentication/iit-delhi-authentication.yml
      - type: Conformance
        url: conformance/iit-delhi-conformance.yml
  - aid: iit-delhi:oai-pmh
    name: IIT Delhi Institutional Repository OAI-PMH
    x-operator: institution
    description: >-
      OAI-PMH 2.0 metadata-harvesting interface for the IIT Delhi DSpace 8
      institutional repository, on the institute's own host. Verified functional on
      2026-08-30, not merely mounted: Identify, ListMetadataFormats, ListSets and
      ListRecords all return valid responses. Thirteen metadata formats are
      advertised — oai_dc, qdc, mods, mets, didl, ore, xoai, dim, rdf, marc, etdms,
      rioxx and uketd_dc — and sets include Electronic Theses and Dissertations plus
      decade collections from 1961 onward. OAI-PMH is an open protocol rather than a
      vendor contract, so this surface is IIT Delhi's to claim.
    humanURL: https://ir.iitd.ac.in/
    baseURL: https://ir.iitd.ac.in/server/oai/request
    tags: [ OAI-PMH, Metadata, Harvesting, Open Access, Library, Research, Theses ]
    properties:
      - type: Documentation
        url: https://ir.iitd.ac.in/server/oai/request?verb=Identify
      - type: Conformance
        url: conformance/iit-delhi-conformance.yml
  - aid: iit-delhi:site-platform
    name: IIT Delhi Departmental Site Platform API
    x-operator: institution
    description: >-
      Undocumented JSON API behind the shared React/Express site platform IIT Delhi
      runs across departmental and unit subdomains. Anonymous reads were confirmed on
      2026-08-30 across three deployments — convocation.iitd.ac.in serves /api/news
      and /api/contact, ird.iitd.ac.in serves /api/contact, /api/circulars and
      /api/announcements, and csc.iitd.ac.in serves /api/contact and /api/pages.
      Media collections and writes are gated behind the institute's own OAuth 2
      server, which the API names in its own 401 body. IIT Delhi publishes no
      documentation, version marker, changelog or contract for this surface; the
      OpenAPI in this repo was reverse-described entirely from live probes and is
      marked as such.
    humanURL: https://convocation.iitd.ac.in/
    baseURL: https://convocation.iitd.ac.in/api
    tags: [ Content, Departmental, JSON, Undocumented, Campus ]
