  - aid: iit-delhi:irins
    name: IIT Delhi Research Profiles on IRINS
    x-operator: tenant
    description: >-
      IIT Delhi's research information management portal is an institution-specific
      tenant on IRINS, the Indian Research Information Network System operated by
      the INFLIBNET Centre, an Inter-University Centre of the University Grants
      Commission. The data — faculty profiles, publications, academic identifiers —
      is IIT Delhi's; the platform, the contract and any API belong to INFLIBNET, so
      nothing is saved under this institution. The host returned a Cloudflare bot
      challenge on 2026-08-30, which grades live rather than dead; the tenancy was
      confirmed by name from third-party sources rather than read directly.
    humanURL: https://iitd.irins.org/
    tags: [ Research Information, Profiles, IRINS, INFLIBNET, Tenant ]
    properties:
      - type: Website
        url: https://iitd.irins.org/
  - aid: iit-delhi:iitd-connect
    name: IITD Connect API (DevClub) — retired
    x-operator: tenant
    description: >-
      Backend API for IITD Connect, the student-built IIT Delhi campus app maintained
      by DevClub, documented via Postman with User, Event, Club/Hostel/Body, News and
      Calendar collections and a bearer-token login. The deployment is DEAD as of
      2026-08-30: api.devclub.in and devclub.iitd.ac.in both 30x to https://devclub.in,
      which does not resolve, and their wildcard TLS certificate expired on
      2025-08-01. The source repository was last pushed in September 2023 and the
      Postman collection declares only a {{url}} variable with no base URL, so no
      callable host exists. Kept as a recorded relationship rather than deleted: this
      is a student-club project running on institute infrastructure, not IIT Delhi's
      own engineering, and the honest record is that it existed and has lapsed.
    humanURL: https://documenter.getpostman.com/view/11367216/SzmmUEKQ
    tags: [ Mobile, Campus, Student, Event, DevClub, Retired ]
