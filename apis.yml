  - aid: iit-delhi:moodle-webservices
    name: IIT Delhi Moodle Web Services
    x-operator: institution
    description: >-
      IIT Delhi self-hosts Moodle for the 2025-2026 academic year at
      moodle.iitd.ac.in, and its web-services endpoint is live: an anonymous call to
      /webservice/rest/server.php returns Moodle's structured invalidtoken error
      rather than a 404, so the REST protocol is enabled and token-gated. No LTI
      Advantage platform endpoints are exposed — /mod/lti/certs.php, token.php and
      auth.php all return 404. The host is the institution's own; the contract is
      Moodle's product contract and is not saved here.
    humanURL: https://moodle.iitd.ac.in/
    baseURL: https://moodle.iitd.ac.in/webservice/rest/server.php
    tags: [ Learning Management, Moodle, Teaching, Campus, Token Auth ]
    properties:
